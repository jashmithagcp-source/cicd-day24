name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run basic test
        run: |
          test -f app.txt
          grep -q "Hello from my CI/CD project!" app.txt

      - name: CI success
        run: echo "CI pipeline passed successfully! 🚀"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy website
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          scp -o StrictHostKeyChecking=no index.html "${VM_USER}@${VM_HOST}:/tmp/index.html"
          ssh -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" \
            'sudo mv /tmp/index.html /var/www/html/index.html && sudo chmod 644 /var/www/html/index.html'
