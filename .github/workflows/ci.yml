name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run basic test
        run: |
          test -f app.txt
          grep -q "Hello from my CI/CD project!" app.txt

      - name: CI success
        run: echo "CI pipeline passed successfully! 🚀"
